name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vermelho bloqueia merge (§10.3). A suíte não é sugestão.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Postgres real para integração e RLS — nunca mock (§10.3).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expedition_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expedition_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/expedition_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expedition_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @expedition/infrastructure db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Guardas de política (RLS em toda tabela · sem TODO)
        run: |
          pnpm check:rls
          pnpm check:markers

      - name: Testes unitários (domínio puro)
        run: pnpm test:unit

      - name: Testes de integração (Postgres real)
        run: pnpm test:integration

      - name: Testes de RLS (isolamento entre tenants)
        run: pnpm test:rls

      # SEC-15: build falha em vulnerabilidade alta.
      - name: Auditoria de dependências
        run: pnpm audit --audit-level high
