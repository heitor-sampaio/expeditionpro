name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vermelho bloqueia merge (§10.3). A suíte não é sugestão.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Postgres real para integração e RLS — nunca mock (§10.3).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expedition_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expedition_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/expedition_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expedition_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @expedition/infrastructure db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b

      # O `tsc -b` segue as referências do tsconfig da raiz — domínio, aplicação,
      # infraestrutura e servidor — e ao mesmo tempo compila o `dist` de que o servidor
      # depende. O que ele **não** faz é olhar para o que não está nessas referências, e
      # `apps/web` nunca esteve: o front inteiro passou meses sem verificação de tipo no CI.
      # Este passo é por pacote, então um app novo entra sozinho em vez de ser esquecido.
      - name: Typecheck de todos os pacotes (inclui o front)
        run: pnpm typecheck

      # Arquivos de raiz e de configuração não vivem em nenhum `src/` e por isso não
      # entravam em tsconfig nenhum — `vite.config.ts`, `vitest.config.ts`, os verificadores
      # de política e, o que mais importa, `prisma/seed.ts` e `prisma.config.ts`. Foi lá que
      # apareceu um `directUrl:` que o Prisma 7 descarta em silêncio: a migration ia pelo
      # pooler enquanto o comentário garantia conexão direta.
      - name: Typecheck dos arquivos de raiz e dos scripts
        run: pnpm typecheck:tools

      # O `tsc -b` compila só o que vai para produção: todo tsconfig do repositório exclui
      # `*.test.ts`. Durante meses os testes ficaram fora de qualquer verificação de tipo, e
      # as fixtures foram divergindo dos tipos reais sem que nada acusasse — campo novo
      # obrigatório ausente, dep morta passada a um caso de uso que a ignora, e um teste que
      # importava um erro inexistente e por isso aceitava qualquer exceção.
      # Fixture que mente é teste que passa sem testar, e o custo aparece meses depois.
      - name: Typecheck dos testes
        run: pnpm typecheck:tests

      - name: Guardas de política (RLS em toda tabela · sem SQL cru · sem TODO)
        run: |
          pnpm check:rls
          pnpm check:raw-sql
          pnpm check:markers

      - name: Testes unitários (domínio puro)
        run: pnpm test:unit

      - name: Testes de integração (Postgres real)
        run: pnpm test:integration

      - name: Testes de RLS (isolamento entre tenants)
        run: pnpm test:rls

      # SEC-15: build falha em vulnerabilidade alta.
      - name: Auditoria de dependências
        run: pnpm audit --audit-level high
