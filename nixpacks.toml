# Instalação no Railway (SEC-16).
#
# O Nixpacks fixa `corepack@0.24.1`, de 2023, e o `packageManager` deste repositório é
# `pnpm@11.23.0`. Aquele corepack não consegue carregar o pnpm moderno no Node 24 — o
# `pnpm i` morre com `ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING`, que é o shim antigo tentando
# `import()` dinâmico sem callback registrado. A mensagem não diz nada sobre versões, e é
# por isso que vale este comentário: sem ele, o próximo a ver esse erro perde meia hora.
#
# A correção é subir o corepack antes de usá-lo. `pnpm i --frozen-lockfile` é mantido:
# lockfile desatualizado deve falhar o build, não ser silenciosamente resolvido.
[phases.install]
cmds = [
  "npm install -g corepack@latest",
  "corepack enable",
  "pnpm install --frozen-lockfile",
]
