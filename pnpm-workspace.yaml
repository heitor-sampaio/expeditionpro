packages:
  - 'packages/*'
  - 'apps/*'

# Build scripts aprovados explicitamente (pnpm 11 bloqueia por padrão).
# esbuild: vitest/tsx. unrs-resolver: eslint-plugin-import-x. prisma: engine + client.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - prisma
  - '@prisma/client'
  - '@prisma/engines'

allowBuilds:
  '@prisma/engines': true
  '@prisma/client': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# SEC-15: deepmerge-ts <8 tem exaustão de pilha (GHSA-ggr8-5vv4-36mx). Chega aqui só
# pelo CLI do Prisma (@prisma/config), que ainda pede a 7.1.5 — não há correção rio acima
# no Prisma 7. É dependência de build, não do caminho de requisição, mas o gate de
# auditoria é alto de propósito: não se baixa a régua, sobe-se a dependência.
overrides:
  deepmerge-ts: '^8.0.2'
  # SEC-15: mysql2 <3.22 rebaixa o plugin de autenticação e vaza credencial em texto
  # claro (GHSA-3f6p-5ww8-9rcr). Chega aqui pelo CLI do Prisma, que traz driver de todo
  # banco suportado. **Este projeto é Postgres** — o mysql2 nunca é carregado. O risco
  # real é zero, mas o gate é alto de propósito e a saída é subir, não afrouxar.
  mysql2: '^3.22.0'
